name: CandleView Release Bundle Resolver
on:
  push:
    branches: [main]
    paths:
      - "releases/**"
permissions:
  contents: write
jobs:
  resolve-and-promote:
    name: Validate and promote one CandleView release bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve, validate, and promote one release bundle
        shell: bash
        env:
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          EVENT_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          normalize_name() {
            LC_ALL=C tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g'
          }
          main_candidates=()
          spec_candidates=()
          mapfile -d '' changed_release_paths < <(
            git diff --name-only -z "$EVENT_BEFORE_SHA" "$EVENT_AFTER_SHA" -- releases/
          )
          if [[ ${#changed_release_paths[@]} -eq 0 ]]; then
            echo "No changed release files were found in this push." >&2
            exit 1
          fi
          for path in "${changed_release_paths[@]}"; do
            [[ -f "$path" ]] || continue
            base_name="${path##*/}"
            normalized="$(printf '%s' "$base_name" | normalize_name)"
            lower_name="$(printf '%s' "$base_name" | LC_ALL=C tr '[:upper:]' '[:lower:]')"
            if [[ "$lower_name" == *.py && "$normalized" == *main* ]]; then
              main_candidates+=("$path")
            fi
            if [[ "$lower_name" == *.txt && "$normalized" == *candleviewapi* ]]; then
              spec_candidates+=("$path")
            fi
          done
          if [[ ${#main_candidates[@]} -ne 1 || ${#spec_candidates[@]} -ne 1 ]]; then
            echo "Expected exactly one main.py and one CandleView_API.txt candidate under releases/." >&2
            printf 'Main candidates: %s\nSpec candidates: %s\n' "${main_candidates[*]:-none}" "${spec_candidates[*]:-none}" >&2
            exit 1
          fi
          main_source="${main_candidates[0]}"
          spec_source="${spec_candidates[0]}"
          bundle_dir="$(dirname "$main_source")"
          if [[ "$(dirname "$spec_source")" != "$bundle_dir" ]]; then
            echo "main.py and CandleView_API.txt must be changed in the same release bundle directory." >&2
            exit 1
          fi
          if [[ ! -s "$main_source" || ! -s "$spec_source" ]]; then
            echo "Release main.py and CandleView_API.txt must not be empty." >&2
            exit 1
          fi

          # A release either remains a legacy pair or is an explicit FC-Next C-A
          # bundle. The runtime import is the contract selector; a partial bundle fails.
          fcnext_files=(
            fc_next_core.py
            fc_next_collection.py
            fc_next_runtime.py
            fc_next_telegram.py
            fc_next_export.py
            fc_next_jobs.py
            FindCoin_FC_NEXT_C_A_CONTRACT.txt
          )
          promote_sources=("$main_source" "$spec_source")
          promote_destinations=("main.py" "CandleView_API.txt")
          if grep -q '^from fc_next_runtime import run_fc_next_ca_scan$' "$main_source"; then
            for file in "${fcnext_files[@]}"; do
              if [[ ! -s "$bundle_dir/$file" ]]; then
                echo "FC-Next release is missing required bundle file: $file" >&2
                exit 1
              fi
              promote_sources+=("$bundle_dir/$file")
              promote_destinations+=("$file")
            done
            (
              cd "$bundle_dir"
              python3 -m py_compile main.py fc_next_core.py fc_next_collection.py fc_next_runtime.py fc_next_telegram.py fc_next_export.py fc_next_jobs.py
              grep -q '^=== 14\. FindCoin FC-Next' FindCoin_FC_NEXT_C_A_CONTRACT.txt
              grep -q 'Gemini를 호출하지 않는다' FindCoin_FC_NEXT_C_A_CONTRACT.txt
              grep -q 'def start_fc_next_ca_job' main.py
              ! grep -q 'run_findcoin(ex_name)' main.py
            )
          else
            python3 -m py_compile "$main_source"
            grep -q '^def run_phase1' "$main_source"
            grep -q '^def run_phase2' "$main_source"
            grep -q 'CANDLEVIEW_PROMPT_FULL' "$main_source"
          fi
          grep -qi 'CandleView' "$spec_source"
          grep -q 'STAGE 0' "$spec_source"

          changed=0
          for index in "${!promote_sources[@]}"; do
            source="${promote_sources[$index]}"
            destination="${promote_destinations[$index]}"
            incoming=".incoming_${destination}"
            cp "$source" "$incoming"
            if ! cmp -s "$incoming" "$destination"; then
              mv "$incoming" "$destination"
              changed=1
            else
              rm "$incoming"
            fi
          done
          if [[ "$changed" -eq 0 ]]; then
            echo "Validated release bundle already matches canonical files." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sha256sum "${promote_destinations[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${promote_destinations[@]}"
          git commit -m "chore: promote validated CandleView release bundle"
          git push origin HEAD:main
          {
            echo "## CandleView release bundle promoted"
            echo
            echo "- Source bundle: \`$bundle_dir\`"
            echo "- FC-Next bundle: \`$([[ ${#promote_destinations[@]} -gt 2 ]] && echo yes || echo no)\`"
          } >> "$GITHUB_STEP_SUMMARY"
